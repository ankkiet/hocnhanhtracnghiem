name: HocnhanhTracnghiem CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # Dừng build nếu có lỗi cú pháp Python hoặc biến chưa định nghĩa
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv*,env,venv,scratch,backup_bgd_feature
        # Cảnh báo các lỗi khác nhưng không ngắt CI
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics --exclude=.venv*,env,venv,scratch,backup_bgd_feature

    - name: Run Unit Tests
      env:
        PYTHONPATH: .
      run: |
        python -m unittest discover -s tests -p "test_*.py"
